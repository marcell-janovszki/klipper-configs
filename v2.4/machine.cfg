[include mainsail.cfg]
[include macros.cfg]

[exclude_object]
[skew_correction]
[pause_resume]

[mcu]
canbus_uuid: c983e22e8f04
canbus_interface: can0

[mcu CB1]
serial: /tmp/klipper_host_mcu

[mcu SHT36]
canbus_uuid: 2fd985c0bdd6
canbus_interface: can0

[printer]
kinematics: corexy
max_velocity: 600  
max_accel: 20000
max_z_velocity: 50
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper (B Motor)
[stepper_x]
step_pin: PF12
dir_pin: PF11
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: ^SHT36:gpio16
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 150
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PF13
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper (A Motor)
[stepper_y]
step_pin: PE2
dir_pin: PB4
enable_pin: !PC11
microsteps: 16
rotation_distance: 40
endstop_pin: PF3
full_steps_per_rotation:200
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 150
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
[stepper_z]
step_pin: PD7
dir_pin: PD6
enable_pin: !PF10
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 340
position_min: -5
homing_speed: 20
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PF9
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PD5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PD4
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: PC9
dir_pin: PC8
enable_pin: !PD1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PD0
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z3 Stepper - Front Right
[stepper_z3]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PF8
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: SHT36:gpio7
dir_pin: SHT36:gpio6
enable_pin: !SHT36:gpio14
rotation_distance: 47.558
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 100
## TEMP
heater_pin: SHT36:gpio23
sensor_type: PT1000
sensor_pin: SHT36:gpio27
pullup_resistor: 1000
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
## PID
control: pid
pid_kp: 36.004
pid_ki: 10.436
pid_kd: 31.053
## PA
pressure_advance: 0.065
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: SHT36:gpio15
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 20
check_gain_time:120
hysteresis: 50
heating_gain: 2

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PB5 
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA0
max_power: 0.9
min_temp: 0
max_temp: 115
control: pid
pid_kp: 47.426
pid_ki: 1.871
pid_kd: 300.561

#####################################################################
# 	Probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_01E56D275157355957202020FF122427-if00
x_offset: 0
y_offset: 20
mesh_main_direction: x
mesh_runs: 1
home_xy_position: 175, 175
home_xy_move_speed: 300
home_z_hop: 5
home_z_hop_speed: 20
contact_max_hotend_temperature: 270
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed

#####################################################################
# 	Fan Control
#####################################################################

# Part cooling fan
[fan]
pin: SHT36:gpio13
cycle_time: 0.01

# Heatbreak fan
[heater_fan heatbreak_cooling_fan]
pin: SHT36:gpio21
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[controller_fan bottom_fan1]
pin: PE6
kick_start_time: 0.5
fan_speed : 0

[controller_fan bottom_fan2]
pin: PE0
kick_start_time: 0.5
fan_speed : 0

#####################################################################
# 	Temperature Sensors
#####################################################################

[temperature_sensor M8P]
sensor_type: temperature_mcu

[temperature_sensor CM1]
sensor_type: temperature_host

[temperature_sensor SHT36]
sensor_type: temperature_mcu
sensor_mcu: SHT36

#####################################################################
# 	Accelerometer Sensors
#####################################################################

# <BEACON>
[resonance_tester]
accel_chip: beacon
probe_points: 175, 175, 20

# [lis2dw]
# cs_pin: SHT36:gpio12
# spi_software_sclk_pin: SHT36:gpio2
# spi_software_mosi_pin: SHT36:gpio3
# spi_software_miso_pin: SHT36:gpio4

# [resonance_tester]
# accel_chip: lis2dw
# probe_points: 175, 175, 20
# min_freq: 5
# max_freq: 133
# accel_per_hz: 60
# hz_per_sec: 1

[input_shaper]
shaper_freq_y: 38.8
shaper_type_y: mzv # 4400 accel
shaper_freq_x: 79.0
shaper_type_x: 2hump_ei # 6900 accel

#####################################################################
# 	Bed Mesh
#####################################################################

[bed_mesh]
algorithm: bicubic
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 320, 300
probe_count: 20, 20
speed: 250
zero_reference_position: 175, 175

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
points:
	50,25
	50,275
	300,275
	300,25
speed: 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

